# Dev stack — deployed from the `dev` branch.
# Secrets are set with `pulumi config set --secret <key>` (see README.md);
# they are KMS-encrypted and safe to commit once set.
secretsprovider: awskms://alias/districtr-pulumi-secrets?region=us-east-2
config:
  aws:region: us-east-2
  districtr-infra:appDomain: dev.districtr.org
  districtr-infra:apiDomain: api.dev.districtr.org
  # Wildcard SAN for label-based PR previews (pr-<N>.dev.districtr.org).
  # Same ACM validation CNAME as the apex, so no new DNS validation record;
  # routing needs a one-time wildcard CNAME `*.dev.districtr.org` -> dev ALB.
  districtr-infra:extraDomains:
    - "*.dev.districtr.org"
  districtr-infra:corsOrigins: https://dev.districtr.org
  districtr-infra:corsOriginRegex: '^https://pr-\d+\.dev\.districtr\.org$'
  districtr-infra:s3BucketName:
    secure: v1:NvATpjb2PUlKwXAz:1KdAv/sq7vkzINPAPM9twpRm7+/8c1GwvnlYKYsB7gr/DyMSjT5dsDZL
  districtr-infra:cdnUrl: https://tilesets1.cdn.districtr.org
  districtr-infra:cmsDomain: cms.dev.districtr.org
  # Tokens minted before the AWS cutover carry the Fly audience; keep it as
  # the `aud` until cutover, then remove to default to https://{apiDomain}/.
  districtr-infra:jwtAudience: https://districtr-v2-api-dev.fly.dev/
  districtr-infra:alarmEmails:
    - dhalpern@uchicago.edu
    - gfang@uchicago.edu
    - peter@mggg.org
