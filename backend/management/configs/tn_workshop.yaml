# TN "Create Your Own Map" workshop: 10 county modules (block-group parent / block
# child), 4 districts each, drawn from gpkgs in <data-dir>/workshop-tn.
#
# Load: python cli.py batch-create-districtr-maps --config-file management/configs/tn_workshop.yaml --data-dir /data
#
# The batch schema (DistrictrMapPublic) can't set these — run after loading:
#   UPDATE districtrmap SET statefps='{47}', map_type='local', comment_length_limit=240
#   WHERE districtr_map_slug LIKE 'tn_%workshop';
# (comment_length_limit gates district descriptions; NULL disables them.)
gerrydb_views:
- gpkg: workshop-tn/tn_davidson_bg_view.gpkg
  layer: tn_davidson_bg_view
- gpkg: workshop-tn/tn_davidson_block_view.gpkg
  layer: tn_davidson_block_view
- gpkg: workshop-tn/tn_shelby_bg_view.gpkg
