name: Test backend

on:
  # Feature branches run via pull_request; a push trigger there would run
  # each suite twice.
  push:
    branches: [dev, main]
    paths: &paths
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  # Also on PRs, so the suite runs against the MERGE RESULT rather than only
  # the branch tip.
  pull_request:
    paths: *paths

# One group per PR, so a new commit cancels its stale run; one per SHA on
# dev/main, so a queued post-merge run is never cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  container-job:
    runs-on: ubuntu-latest

    container: python:3.12.6

    services:
      postgres:        
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_SCHEME: postgresql+psycopg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_SERVER: postgres
          POSTGRES_PORT: 5432
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          apt-get update
          apt-get install -y openssh-client libpq-dev postgresql libpq-dev gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          pip install uv==0.12.23
          uv pip install --system -r requirements.txt
        working-directory: backend

      - name: Run migrations
        run: |
          alembic upgrade head
        working-directory: backend
        env:
          DOMAIN: postgres
          ENVIRONMENT: test
          PROJECT_NAME: Districtr v2 backend
          BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:5173"
          SECRET_KEY: mysupersecretkey
          DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
          POSTGRES_SCHEME: postgresql+psycopg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_SERVER: postgres
          POSTGRES_PORT: 5432
          AUTH_JWKS_URL: http://localhost:8001/.well-known/jwks.json
          AUTH_AUDIENCE: http://localhost:8000/
          AUTH_ISSUER: http://localhost:8001
          AUTH_ALGORITHMS: RS256

      - name: Run tests
        run: pytest -v
        working-directory: backend
        env:
          DOMAIN: postgres
          ENVIRONMENT: test
          PROJECT_NAME: Districtr v2 backend
          BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:5173"
          SECRET_KEY: mysupersecretkey
          DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
          POSTGRES_SCHEME: postgresql+psycopg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_SERVER: postgres
          POSTGRES_PORT: 5432
          AUTH_JWKS_URL: http://localhost:8001/.well-known/jwks.json
          AUTH_AUDIENCE: http://localhost:8000/
          AUTH_ISSUER: http://localhost:8001
          AUTH_ALGORITHMS: RS256
