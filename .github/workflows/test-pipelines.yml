name: Test pipelines

on:
  # Same shape as the other test workflows: PRs run via pull_request, so push
  # only covers dev/main.
  push:
    branches: [dev, main]
    paths: &paths
      - "pipelines/**"
      - ".github/workflows/test-pipelines.yml"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline tests
    runs-on: ubuntu-latest

    container: python:3.12.6

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL and system dependencies
        run: |
          apt-get update
          apt-get install -y gdal-bin libgdal-dev libsqlite3-dev

      - name: Install dependencies
        run: |
          pip install uv==0.12.23
          uv pip install --system -r requirements.txt pytest
        working-directory: pipelines

      - name: Run tests
        run: pytest tests/ -v
        working-directory: pipelines
        env:
          PYTHONPATH: .
