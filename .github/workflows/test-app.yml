name: Test app

on:
  push:
    paths: &paths
      - "app/**"
      - ".github/workflows/test-app.yml"
  # Also on PRs, so the suite runs against the merge result.
  pull_request:
    paths: *paths

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      # Unit tests only (*.test.ts under src); Playwright e2e runs separately.
      - run: bun run test
