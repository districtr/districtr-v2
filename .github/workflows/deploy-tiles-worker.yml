name: Deploy tiles Worker

on:
  push:
    branches: [dev, main]
    paths: &paths
      - "tiles-worker/**"
      - ".github/workflows/deploy-tiles-worker.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: deploy-tiles-worker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tiles-worker

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # dev deploys districtr-tiles-dev and main deploys districtr-tiles (wrangler.jsonc).
  # A pull request runs unreviewed code, so it stops at the type-check and holds no
  # Cloudflare token.
  deploy:
    name: Deploy
    needs: typecheck
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    env:
      WRANGLER_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env="$WRANGLER_ENV"
      # A deploy empties Cloudflare's cache for the Worker, so this reads R2 through the
      # new version and compares the tiles byte for byte with the CDN's. The hostname is
      # the one this stack's app reads tiles from, empty until the stack is switched over.
      - name: Check tiles against the CDN
        env:
          WORKER_URL_DEV: ${{ vars.TILES_WORKER_URL_DEV }}
          WORKER_URL_PROD: ${{ vars.TILES_WORKER_URL_PROD }}
        run: |
          if [ "$WRANGLER_ENV" = "dev" ]; then WORKER_URL="$WORKER_URL_DEV"; else WORKER_URL="$WORKER_URL_PROD"; fi
          WORKER_URL="$(printf '%s' "$WORKER_URL" | sed 's:/*$::')"
          if [ -z "$WORKER_URL" ]; then
            echo "This stack has no Worker URL set yet; nothing to check."
            exit 0
          fi
          bun run check "$WORKER_URL"
