{% load wagtailadmin_tags %}
{# Precinct grid: sixteen precincts in three contiguous districts; two border #}
{# precincts periodically swap to a neighbouring district. One colour #}
{# (currentColor), districts told apart by opacity. #}
<svg
    class="{% classnames "districtr-admin-logo" classname %}"
    role="img"
    aria-label="Districtr"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 96 96"
>
    <style>
        .districtr-admin-logo {
            color: #0099cd;
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .districtr-admin-logo__a { opacity: 1; }
        .districtr-admin-logo__b { opacity: 0.55; }
        .districtr-admin-logo__c { opacity: 0.25; }

        .districtr-admin-logo__flip-ac {
            opacity: 0.25;
            animation: districtr-admin-logo-flip-ac 7s steps(1) infinite;
        }

        .districtr-admin-logo__flip-bc {
            opacity: 0.55;
            animation: districtr-admin-logo-flip-bc 7s steps(1) infinite;
        }

        .w-userbar-icon.districtr-admin-logo,
        .sidebar-custom-branding .districtr-admin-logo {
            color: #fff;
            width: 64px;
            height: 64px;
        }

        .login-logo .districtr-admin-logo {
            width: 8rem;
            height: 8rem;
        }

        /* Brand blue's faint districts vanish on the dark login card. */
        .w-theme-dark .login-logo .districtr-admin-logo {
            color: #5ccbef;
        }

        @media (prefers-color-scheme: dark) {
            .w-theme-system .login-logo .districtr-admin-logo {
                color: #5ccbef;
            }
        }

        .page404__logo .districtr-admin-logo {
            color: #fff;
            width: 100%;
            height: 100%;
        }

        @keyframes districtr-admin-logo-flip-ac {
            0% { opacity: 0.25; }
            35% { opacity: 1; }
            70% { opacity: 0.25; }
        }

        @keyframes districtr-admin-logo-flip-bc {
            0% { opacity: 0.55; }
            55% { opacity: 0.25; }
            85% { opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            .districtr-admin-logo__flip-ac,
            .districtr-admin-logo__flip-bc {
                animation: none;
            }
        }
    </style>
    <g fill="currentColor">
        <rect class="districtr-admin-logo__a" x="7" y="7" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__a" x="29" y="7" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__b" x="51" y="7" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__b" x="73" y="7" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__a" x="7" y="29" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__a" x="29" y="29" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__b" x="51" y="29" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__b" x="73" y="29" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__a" x="7" y="51" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__flip-ac" x="29" y="51" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__flip-bc" x="51" y="51" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__b" x="73" y="51" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__c" x="7" y="73" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__c" x="29" y="73" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__c" x="51" y="73" width="18" height="18" rx="4" />
        <rect class="districtr-admin-logo__c" x="73" y="73" width="18" height="18" rx="4" />
    </g>
</svg>
