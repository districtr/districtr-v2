{# One takedown action (nsfw/hidden toggle) as its own POST form. #}
<form method="post" action="{% url 'portals_submission_action' %}" style="display:inline">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ entry.id }}">
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="value" value="{{ value }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="button button-small{% if danger %} no{% endif %}">{{ label }}</button>
</form>
