# Exact-version constraints for cms/requirements.txt — the full transitive
# tree, generated with `pip freeze` inside the built image. This service
# signs every auth token in the system post-cutover; the constraint file
# keeps a routine rebuild from silently pulling a different version of
# anything in the crypto/JWT chain (PyJWT, cryptography, simplejwt).
#
# To refresh (deliberately, e.g. for a security bump):
#   docker-compose build cms && docker-compose run --rm cms pip freeze > cms/requirements.lock
